[project]
name = "agentic-ml-engineer"
version = "0.1.0"
description = "Agentic ML Engineer (AME) — an autonomous ML engineering agent that audits data, retrieves domain knowledge, designs experiments, and critiques its own results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["apps*", "agent*", "tools*", "domain*", "experiments*", "db*", "evaluation*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
